# HELD-OUT v2 injectable faults for the simulated BCM (uds_assistant/simulator).
# Same schema as bug_catalog.yaml plus `heldout_v2: true`. These ids live in
# uds_assistant.simulator.bugs.HELDOUT_V2_BUG_IDS and are implemented by explicit
# hooks in uds_assistant/simulator/{ecu,services}.py.
# category: nrc_order | session | security | timing | data | format | sequence
# expected_detection: test categories (positive | negative | session | security | timing)

bugs:
  - id: session_reentry_keeps_unlock
    title: "Re-entering the current session keeps security unlocked"
    description: >
      A positive DiagnosticSessionControl whose target equals the active session skips the
      security re-lock, so a level unlocked in the extended session is still unlocked after
      another 10 03 and a protected write succeeds instead of answering 0x33.
    category: session
    expected_detection: [session, security, negative]
    heldout_v2: true

  - id: s3_restart_skipped_on_negative_response
    title: "S3 timer restarted only by positively answered requests"
    description: >
      A request answered with a negative response does not restart the S3 timer, so a tester
      that keeps receiving NRCs sees the session expire as if it had been idle.
    category: timing
    expected_detection: [timing, session]
    heldout_v2: true

  - id: s3_timeout_resets_lockout_counters
    title: "S3 timeout wipes security lockout state"
    description: >
      When the S3 timeout drops the ECU to the default session, the failed-attempt counters
      and lockout deadlines of every level are cleared, so waiting out S3 lifts an active
      0x37 delay.
    category: session
    expected_detection: [timing, security, negative]
    heldout_v2: true

  - id: ecu_reset_keeps_session
    title: "ECUReset keeps the active diagnostic session"
    description: >
      11 01 / 11 03 lock security and clear seeds and routine status but leave the session
      unchanged instead of returning to the default session.
    category: session
    expected_detection: [session, positive]
    heldout_v2: true

  - id: seed_request_keeps_stale_pending_seed
    title: "A repeated requestSeed does not replace the pending seed"
    description: >
      When a seed is already pending for the level, a new requestSeed returns a fresh seed
      but the older seed stays stored, so the key computed from the newest seed is rejected
      with 0x35.
    category: security
    expected_detection: [security, negative]
    heldout_v2: true

  - id: key_compare_prefix_only
    title: "Key verification compares only the first two bytes"
    description: >
      The received key is checked against the expected key over its first two bytes only; a
      key with correct leading bytes and a wrong tail unlocks the level instead of 0x35.
    category: security
    expected_detection: [security, negative]
    heldout_v2: true

  - id: lockout_counter_pooled_across_levels
    title: "Failed-key counter shared by all security levels"
    description: >
      The lockout threshold is evaluated against the sum of failed keys over all levels, so
      failures at level 1 bring level 3 to 0x36 early.
    category: security
    expected_detection: [security, negative]
    heldout_v2: true

  - id: nrc_order_range_before_security
    title: "Wrong NRC priority: 0x31 value range before 0x33 on WriteDataByIdentifier"
    description: >
      For a correct-length write, an out-of-range value is rejected with 0x31 before the
      security-access check, so a locked ECU answers 0x31 instead of 0x33.
    category: nrc_order
    expected_detection: [negative, security]
    heldout_v2: true

  - id: nrc_order_nvm_fault_before_group_check
    title: "Wrong NRC priority: 0x72 before the group check on ClearDiagnosticInformation"
    description: >
      With the NVM write fault active, an unknown DTC group is answered 0x72 instead of 0x31.
    category: nrc_order
    expected_detection: [negative]
    heldout_v2: true

  - id: read_dtc_trailing_bytes_accepted
    title: "ReadDTCInformation accepts trailing bytes after the status mask"
    description: >
      19 02 with more than one byte after the subfunction is processed using the first mask
      byte instead of being rejected with 0x13.
    category: format
    expected_detection: [negative]
    heldout_v2: true

  - id: routine_option_record_overlong_accepted
    title: "RoutineControl start accepts an over-long option record"
    description: >
      A start request carrying more option-record bytes than the routine defines is
      accepted instead of 0x13.
    category: format
    expected_detection: [negative]
    heldout_v2: true

  - id: write_range_upper_bound_exclusive
    title: "Write value range treats the maximum as exclusive"
    description: >
      A value equal to the DID's max is rejected with 0x31 instead of being stored, so the
      top of the inclusive range cannot be written.
    category: data
    expected_detection: [negative, positive]
    heldout_v2: true

  - id: multi_did_read_dedups_repeats
    title: "Repeated DIDs in one read answered once"
    description: >
      A DID listed several times in one 0x22 request appears only once in the response
      instead of once per occurrence.
    category: data
    expected_detection: [positive]
    heldout_v2: true

  - id: routine_restart_after_stop_blocked
    title: "Routine cannot be restarted after being stopped"
    description: >
      A start for a routine whose status is stopped is answered 0x24 instead of running
      again.
    category: sequence
    expected_detection: [negative, positive]
    heldout_v2: true

  - id: suppressed_seed_request_not_stored
    title: "Suppressed requestSeed does not store the pending seed"
    description: >
      27 81 / 27 83 consume a seed from the counter and send nothing, but the seed is not
      kept as pending, so the following key gets 0x24.
    category: security
    expected_detection: [security, negative]
    heldout_v2: true
