[project]
name = "uds-assistant"
version = "0.1.0"
description = "Local UDS diagnostics & automated test generation assistant"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2",
    "pyyaml",
    "udsoncan",
    "can-isotp",
    "python-can",
    "chromadb",
    "fastembed",
    "uvicorn",
    "fastapi",
    "httpx",
    "langgraph",
    "pypdf",
]

[project.optional-dependencies]
ui = ["streamlit"]
export = ["pytest"]
dev = ["pytest", "httpx", "ruff"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
testpaths = ["tests"]

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["uds_assistant*"]
