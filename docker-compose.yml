# Written, not built or tested in this environment (limited network).
services:
  app:
    build: .
    ports:
      - "8000:8000"   # FastAPI (http://localhost:8000/docs)
      - "8501:8501"   # Streamlit UI (http://localhost:8501)
    environment:
      LLM_MODE: ${LLM_MODE:-mock}        # mock | ollama
      RETRIEVER: ${RETRIEVER:-bm25}      # bm25 | chroma
      OLLAMA_HOST: http://ollama:11434
      OLLAMA_MODEL: ${OLLAMA_MODEL:-qwen2.5:3b-instruct-q4_K_M}
    depends_on:
      - ollama
    volumes:
      - app_outputs:/app/outputs
    restart: unless-stopped

  ollama:
    image: ollama/ollama
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    restart: unless-stopped
    # --- Optional NVIDIA GPU support ---------------------------------------
    # 1. Install the NVIDIA driver and the NVIDIA Container Toolkit on the host.
    # 2. Uncomment the block below (keep the indentation under "ollama:").
    # 3. Run: docker compose up -d --build
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: all
    #           capabilities: [gpu]

volumes:
  ollama_data:
  app_outputs:
