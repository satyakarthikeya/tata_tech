# One command: docker compose up --build   ->  http://localhost:8000
#
# Needs: Docker with the NVIDIA Container Toolkit (Docker Desktop on Windows with WSL2 + an NVIDIA
# driver works). Ollama runs in a container with the GPU; the model is pulled once into a volume.
# No GPU? Delete the "deploy" block of the ollama service (it then runs on the CPU, slowly).
# Ollama already running on this machine? Use docker-compose.host-ollama.yml instead.
services:
  ollama:
    image: ollama/ollama:latest
    environment:
      OLLAMA_FLASH_ATTENTION: "1"
      OLLAMA_KV_CACHE_TYPE: q8_0
      OLLAMA_MAX_LOADED_MODELS: "1"
      OLLAMA_KEEP_ALIVE: 10m
    volumes:
      - ollama_data:/root/.ollama
    ports:
      - "127.0.0.1:11434:11434"
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 10s
      timeout: 5s
      retries: 12
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    restart: unless-stopped

  # Pulls the model once (about 2 GB, needs internet the first time) and exits.
  model-pull:
    image: ollama/ollama:latest
    depends_on:
      ollama:
        condition: service_healthy
    environment:
      OLLAMA_HOST: http://ollama:11434
    entrypoint: ["ollama", "pull", "${OLLAMA_MODEL:-qwen2.5:3b-instruct-q4_K_M}"]
    restart: "no"

  app:
    build: .
    depends_on:
      ollama:
        condition: service_healthy
      model-pull:
        condition: service_completed_successfully
    environment:
      OLLAMA_HOST: http://ollama:11434
      OLLAMA_MODEL: ${OLLAMA_MODEL:-qwen2.5:3b-instruct-q4_K_M}
      OLLAMA_NUM_CTX: ${OLLAMA_NUM_CTX:-4096}
      OLLAMA_TRUSTED_HOSTS: ollama
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - app_outputs:/app/outputs
    restart: unless-stopped

volumes:
  ollama_data:
  app_outputs:
